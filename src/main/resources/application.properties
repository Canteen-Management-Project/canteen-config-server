spring.application.name=canteen-config-server
server.port=9092


eureka.client.service-url.default-zone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
instance.prefer-ip-address=true


spring.cloud.config.server.git.uri=https://github.com/Canteen-Management-Project/canteen-management-configuration
#spring.cloud.config.server.git.uri=https://github.com/ketan1123/microservices-config-server.git
spring.cloud.config.server.git.clone-on-start=true